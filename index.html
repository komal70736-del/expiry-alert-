<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Expiry Alert – Track Smart. Get Alerts. Reduce Waste.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6fafd;--card:#fff;--tx:#0f2547;--mu:#5b6b85;--pr:#0b2a5b;--ac:#2f6fed;--mint:#d9f5ea;--bd:#e2eaf3;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--sh:0 6px 24px rgba(15,37,71,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--card:#13203a;--tx:#e8eefb;--mu:#9db0cf;--pr:#5b8cff;--bd:#223559;--mint:#12332e;--sh:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1424;--card:#13203a;--tx:#e8eefb;--mu:#9db0cf;--pr:#5b8cff;--bd:#223559;--mint:#12332e;--sh:0 6px 24px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{margin:0 0 .4em;line-height:1.2;color:var(--tx)}a{color:var(--ac);text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;color:var(--pr);display:flex;gap:8px;align-items:center}nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{padding:6px 11px;border-radius:8px;color:var(--mu);font-weight:500}nav a:hover,nav a.on{background:var(--mint);color:var(--tx)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:600 14px inherit;cursor:pointer;display:inline-block}
:root[data-theme="dark"] .btn{color:#06122a}.btn.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--er);color:#fff}.btn.sm{padding:5px 10px;font-size:12px}
.wrap{max-width:1150px;margin:auto;padding:24px 20px}.app{display:grid;grid-template-columns:210px 1fr;min-height:80vh}
aside{background:var(--card);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:3px}
aside a{padding:9px 12px;border-radius:10px;color:var(--mu);font-weight:500}aside a.on,aside a:hover{background:var(--mint);color:var(--tx)}
main{padding:22px;min-width:0}@media(max-width:760px){.app{grid-template-columns:1fr}aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd)}aside a{white-space:nowrap}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.hero{background:linear-gradient(135deg,var(--mint),var(--card) 60%);border-radius:24px;padding:48px 30px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}@media(max-width:800px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(28px,4.5vw,46px);color:var(--pr)}.mu{color:var(--mu)}.big{font-size:28px;font-weight:800}.ic{font-size:30px}
section.blk{padding:34px 0}.tag{font-size:12px;background:var(--mint);padding:2px 8px;border-radius:99px;color:var(--tx)}
.st{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}.Safe{background:var(--ok)}.Soon{background:var(--wa)}.Today{background:#ea580c}.Expired{background:var(--er)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}label{font-weight:600;font-size:13px;display:block;margin:10px 0 4px}
.err{color:var(--er);font-size:12px;min-height:14px}table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}.tw{overflow-x:auto}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bar>*{width:auto;flex:1 1 150px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{min-height:54px;border:1px solid var(--bd);border-radius:8px;padding:3px 5px;font-size:12px;cursor:pointer;background:var(--card)}.cal .h{min-height:0;border:0;font-weight:700;text-align:center;cursor:default;background:none}.cal .sel{outline:2px solid var(--ac)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);max-width:440px;width:92%}
.thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--mint);display:inline-flex;align-items:center;justify-content:center;font-size:20px}
footer{border-top:1px solid var(--bd);padding:24px 20px;text-align:center;color:var(--mu)}canvas{max-height:280px}
details{border-bottom:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:600}
</style></head><body>
<header><a class="logo" href="#home">🗓️🔔 EXPIRY ALERT</a><nav id="nav"></nav><button class="btn s sm" id="th" title="Toggle theme">🌓</button><span id="who"></span></header>
<div id="root"></div><footer>© 2026 Expiry Alert – Track Smart. Get Alerts. Reduce Waste.<br><small>B.Tech CSE college project · demo data stored only in your browser</small></footer>
<dialog id="dlg"></dialog>
<script>
const CATS=["Food & Groceries","Dairy Products","Fruits & Vegetables","Medicines","Cosmetics","Household Products","Other"];
const EM={"Food & Groceries":"🍞","Dairy Products":"🥛","Fruits & Vegetables":"🥕","Medicines":"💊","Cosmetics":"🧴","Household Products":"🧽","Other":"📦"};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="expiryAlertV1";let S;
const iso=d=>{const x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)};
function seed(){const r=[["Milk",1,-3,"Dairy Products","Fridge"],["Bread",2,0,"Food & Groceries","Kitchen shelf"],["Cheese",1,2,"Dairy Products","Fridge"],["Juice",3,5,"Food & Groceries","Fridge"],["Biscuits",4,20,"Food & Groceries","Pantry"],["Shampoo",1,60,"Cosmetics","Bathroom"],["Face cream",1,120,"Cosmetics","Bedroom"],["Floor cleaner",2,200,"Household Products","Store room"],["Paracetamol",1,12,"Medicines","Medicine box"],["Spinach",2,3,"Fruits & Vegetables","Fridge"]];
return r.map((a,i)=>({id:"s"+i,name:a[0],qty:a[1],cat:a[3],loc:a[4],buy:iso(-30),exp:iso(a[2]),rem:true,img:"",sample:true}))}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.products)return j}catch(e){}return{products:seed(),user:null,prefs:{d7:true,d3:true,d1:true,d0:true},theme:""}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();if(S.theme)document.documentElement.dataset.theme=S.theme;
const days=p=>Math.round((new Date(p.exp+"T00:00:00")-new Date(new Date().toDateString()))/864e5);
const stat=p=>{const d=days(p);return d<0?["Expired","Expired"]:d==0?["Today","Expires Today"]:d<=7?["Soon","Expiring Soon"]:["Safe","Safe"]};
const badge=p=>{const s=stat(p);return `<span class="st ${s[0]}">${s[1]}</span>`};
const left=p=>{const d=days(p);return d<0?`${-d}d ago`:d==0?"today":`${d} days`};
const th=p=>p.img?`<img class="thumb" src="${p.img}" alt="">`:`<span class="thumb">${EM[p.cat]||"📦"}</span>`;
let charts=[];const mk=(id,cfg)=>{const c=$("#"+id);if(c)charts.push(new Chart(c,cfg))};
const COL=["#2f6fed","#34d399","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#94a3b8"];
const catCount=()=>CATS.map(c=>S.products.filter(p=>p.cat==c).length);
function monthly(){const m={};S.products.forEach(p=>{const k=p.exp.slice(0,7);m[k]=(m[k]||0)+1});const ks=Object.keys(m).sort();return[ks,ks.map(k=>m[k])]}
const sideItems=[["dashboard","📊 Dashboard"],["products","📦 My Products"],["add","➕ Add Product"],["calendar","🗓️ Expiry Calendar"],["notifications","🔔 Notifications"],["reports","📈 Reports & Analytics"],["insights","✨ AI Insights"],["assistant","🤖 AI Assistant"],["settings","⚙️ Settings"]];
const pub=["home","features","how","dashboard","assistant","contact"];
let editId=null,calM=new Date(),calSel=null,Q="",F="",SO="asc";
function shell(route,html){const side=sideItems.some(x=>x[0]==route);return side?`<div class="app"><aside>${sideItems.map(x=>`<a href="#${x[0]}" class="${x[0]==route?"on":""}">${x[1]}</a>`).join("")}</aside><main>${html}</main></div>`:html}
const stats=()=>{const c={Safe:0,Soon:0,Today:0,Expired:0};S.products.forEach(p=>c[stat(p)[0]]++);return c};
const V={
home:()=>`<div class="wrap"><div class="hero"><div><span class="tag">Smart Expiry &amp; Reminder System</span><h1>Don’t Let Expiry Dates Catch You Off Guard.</h1><p class="mu">Expiry Alert helps students, families, hostels, stores and pharmacies track products, spot what is about to expire and waste less.</p><p><a class="btn" href="#${S.user?"dashboard":"login"}">Get Started</a> <a class="btn s" href="#features">Explore Features</a></p></div>
<svg viewBox="0 0 360 260" role="img" aria-label="Groceries and expiry calendar illustration"><rect x="20" y="20" width="320" height="220" rx="24" fill="var(--card)" stroke="var(--bd)"/><rect x="40" y="40" width="130" height="24" rx="8" fill="var(--mint)"/><text x="52" y="57" font-size="13" fill="var(--tx)">Milk · 1 day left</text><circle cx="290" cy="52" r="10" fill="#f59e0b"/><text x="52" y="110" font-size="46">🥛🍞🧀</text><text x="52" y="170" font-size="46">🥕🍎🧴</text><rect x="40" y="195" width="280" height="30" rx="10" fill="var(--pr)"/><text x="56" y="215" font-size="13" fill="#fff">🔔 Cheese expires in 2 days</text></svg></div>
<section class="blk"><p class="mu"><span class="tag">Demo statistics</span></p><div class="grid g3"><div class="card"><div class="big">12,480</div>Products tracked (demo)</div><div class="card"><div class="big">3,920</div>Reminders generated (demo)</div><div class="card"><div class="big">38%</div>Waste reduced (demo)</div></div></section>
<section class="blk" id="features"><h2>Features</h2><div class="grid g3">${[["📦","Product management","Add, edit, delete, search, filter and sort products."],["🚦","Colour-coded status","Safe, Expiring Soon, Expires Today and Expired from real dates."],["🗓️","Expiry calendar","See expiry dates by month and click a day for details."],["🔔","Reminder panel","Choose 7, 3, 1 and expiry-day reminders (shown in-app)."],["📈","Reports &amp; charts","Category, monthly and upcoming expiry charts with CSV export."],["✨","AI-ready insights","Rule-based summaries with a hook to connect a real AI API."]].map(f=>`<div class="card"><div class="ic">${f[0]}</div><h3>${f[1]}</h3><span class="mu">${f[2]}</span></div>`).join("")}</div></section>
<section class="blk" id="how"><h2>How It Works</h2><div class="grid g3">${[["1","Add your products","Enter name, category, quantity and expiry date."],["2","Track expiry dates","Days remaining are calculated automatically."],["3","Receive timely alerts","See reminders in the notification panel."]].map(f=>`<div class="card"><div class="big">${f[0]}</div><h3>${f[1]}</h3><span class="mu">${f[2]}</span></div>`).join("")}</div></section>
<section class="blk"><div class="card"><h2>🤖 AI Assistant</h2><p class="mu">A Botpress chatbot can be embedded from the AI Assistant page using its official webchat code. No chatbot is active until you add your own embed URL.</p><a class="btn" href="#assistant">Open AI Assistant</a></div></section>
<section class="blk"><h2>What users say <span class="tag">Sample testimonials</span></h2><div class="grid g3">${[["Hostel warden","Easy to see what to use first."],["Pharmacy owner","The colour codes save time."],["Student","Finally stopped throwing away milk."]].map(t=>`<div class="card">“${t[1]}”<br><b>— ${t[0]}</b> <span class="mu">(sample)</span></div>`).join("")}</div></section>
<section class="blk" id="contact"><div class="card"><h2>Contact</h2><div class="grid g2"><div><label>Name</label><input id="cn"><label>Email</label><input id="ce" type="email"><label>Message</label><textarea id="cm" rows="3"></textarea><div class="err" id="cerr"></div><button class="btn" onclick="contact()">Send</button></div><div class="mu">This is a demo form: messages are not sent anywhere. Connect a form service (e.g. Formspree) to receive real messages.<br><br>📍 Jaipur, Rajasthan</div></div></div></section></div>`,
features:()=>V.home(),how:()=>V.home(),contact:()=>V.home(),
login:()=>`<div class="wrap" style="max-width:440px"><div class="card"><h2 id="lt">Login</h2><div id="nm" hidden><label>Name</label><input id="ln"></div><label>Email</label><input id="le" type="email"><label>Password</label><input id="lp" type="password"><div class="err" id="lerr"></div><button class="btn" onclick="auth()">Continue</button> <button class="btn s" onclick="demo()">Use demo login</button><p class="mu"><small>Demo only: no real authentication service is connected. Details stay in this browser.</small></p><a href="#" onclick="tog();return false" id="tl">New here? Create an account</a></div></div>`,
dashboard:()=>{const c=stats(),up=S.products.filter(p=>days(p)>=0).sort((a,b)=>days(a)-days(b)).slice(0,5);return shell("dashboard",`<h2>Dashboard</h2><div class="grid g4"><div class="card"><div class="mu">Total products</div><div class="big">${S.products.length}</div></div><div class="card"><div class="mu">Safe</div><div class="big" style="color:var(--ok)">${c.Safe}</div></div><div class="card"><div class="mu">Expiring soon</div><div class="big" style="color:var(--wa)">${c.Soon+c.Today}</div></div><div class="card"><div class="mu">Expired</div><div class="big" style="color:var(--er)">${c.Expired}</div></div></div><br><div class="grid g2"><div class="card"><h3>Category breakdown</h3><canvas id="c1"></canvas></div><div class="card"><h3>Upcoming reminders</h3>${up.length?up.map(p=>`<div>${th(p)} ${esc(p.name)} — ${left(p)} ${badge(p)}</div>`).join("<br>"):empty("Nothing upcoming.")}</div></div><br><div class="card"><h3>Recent activity</h3>${(S.log||[]).slice(-5).reverse().map(x=>`<div class="mu">• ${esc(x)}</div>`).join("")||empty("No activity yet. Add or edit a product.")}</div>`)},
products:()=>{let l=S.products.filter(p=>p.name.toLowerCase().includes(Q.toLowerCase())&&(!F||p.cat==F));l.sort((a,b)=>SO=="asc"?a.exp.localeCompare(b.exp):b.exp.localeCompare(a.exp));return shell("products",`<h2>My Products</h2><div class="bar"><input placeholder="Search products…" value="${esc(Q)}" oninput="Q=this.value;go(true)" id="sq"><select onchange="F=this.value;go()"><option value="">All categories</option>${CATS.map(c=>`<option ${F==c?"selected":""}>${c}</option>`).join("")}</select><select onchange="SO=this.value;go()"><option value="asc">Expiry: soonest first</option><option ${SO=="desc"?"selected":""} value="desc">Expiry: latest first</option></select><a class="btn" href="#add" style="flex:0 0 auto">+ Add</a></div>${l.length?`<div class="card tw"><table><tr><th></th><th>Product</th><th>Category</th><th>Expiry</th><th>Left</th><th>Status</th><th></th></tr>${l.map(p=>`<tr><td>${th(p)}</td><td>${esc(p.name)} <small class="mu">×${p.qty}</small>${p.sample?' <span class="tag">sample</span>':""}</td><td>${p.cat}</td><td>${p.exp}</td><td>${left(p)}</td><td>${badge(p)}</td><td style="white-space:nowrap"><button class="btn s sm" onclick="view('${p.id}')">View</button> <button class="btn s sm" onclick="edit('${p.id}')">Edit</button> <button class="btn d sm" onclick="del('${p.id}')">Delete</button></td></tr>`).join("")}</table></div>`:empty("No products match. Try another search or add a product.")}`)},
add:()=>{const p=S.products.find(x=>x.id==editId)||{name:"",qty:1,cat:CATS[0],buy:iso(0),exp:"",loc:"",rem:true,img:""};return shell("add",`<h2>${editId?"Edit":"Add"} Product</h2><div class="card" style="max-width:640px"><label>Product name</label><input id="pn" value="${esc(p.name)}"><div class="err" id="e1"></div><div class="grid g2"><div><label>Category</label><select id="pc">${CATS.map(c=>`<option ${p.cat==c?"selected":""}>${c}</option>`).join("")}</select></div><div><label>Quantity</label><input id="pq" type="number" min="1" value="${p.qty}"></div><div><label>Purchase date</label><input id="pb" type="date" value="${p.buy}"></div><div><label>Expiry date</label><input id="px" type="date" value="${p.exp}"></div></div><div class="err" id="e2"></div><label>Storage location</label><input id="pl" value="${esc(p.loc)}" placeholder="Fridge, pantry…"><label>Product image (optional)</label><input id="pi" type="file" accept="image/*"><label><input id="pr" type="checkbox" style="width:auto" ${p.rem?"checked":""}> Remind me about this product</label><br><button class="btn" onclick="saveP()">${editId?"Save changes":"Add product"}</button> <a class="btn s" href="#products" onclick="editId=null">Cancel</a></div>`)},
calendar:()=>{const y=calM.getFullYear(),m=calM.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let c=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="h">${d}</div>`).join("")+"<div style='visibility:hidden'></div>".repeat(f);for(let d=1;d<=n;d++){const k=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,ps=S.products.filter(p=>p.exp==k);c+=`<div class="${calSel==k?"sel":""}" onclick="calSel='${k}';go()">${d}<br>${ps.map(p=>`<span class="dot ${stat(p)[0]}"></span>`).join("")}</div>`}const sp=S.products.filter(p=>p.exp==calSel);return shell("calendar",`<h2>Expiry Calendar</h2><div class="bar"><button class="btn s" style="flex:0 0 auto" onclick="calM=new Date(${y},${m-1},1);go()">‹</button><b style="flex:1;text-align:center">${calM.toLocaleString("en",{month:"long",year:"numeric"})}</b><button class="btn s" style="flex:0 0 auto" onclick="calM=new Date(${y},${m+1},1);go()">›</button></div><div class="grid g2"><div class="card"><div class="cal">${c}</div></div><div class="card"><h3>${calSel||"Select a date"}</h3>${calSel?(sp.length?sp.map(p=>`<div>${th(p)} ${esc(p.name)} ${badge(p)}</div>`).join("<br>"):empty("No products expire on this date.")):empty("Click a date to see products expiring then.")}</div></div>`)},
notifications:()=>{const P=S.prefs,n=S.products.filter(p=>{const d=days(p);return p.rem&&(d<0||(d==0&&P.d0)||(d==1&&P.d1)||(d>1&&d<=3&&P.d3)||(d>3&&d<=7&&P.d7))}).sort((a,b)=>days(a)-days(b));return shell("notifications",`<h2>Notifications</h2><p class="mu"><span class="tag">Demo</span> Alerts appear here in the app only. Email, SMS and browser push are not connected.</p><div class="card">${n.length?n.map(p=>`<div>${days(p)<0?"⛔":"🔔"} <b>${esc(p.name)}</b> — ${days(p)<0?"expired "+left(p):days(p)==0?"expires today":"expires in "+left(p)} ${badge(p)}</div>`).join("<hr style='border:0;border-top:1px solid var(--bd)'>"):empty("You’re all caught up 🎉")}</div>`)},
reports:()=>{const c=stats();return shell("reports",`<h2>Reports &amp; Analytics</h2><div class="grid g4"><div class="card">Total<div class="big">${S.products.length}</div></div><div class="card">Safe<div class="big">${c.Safe}</div></div><div class="card">Expiring<div class="big">${c.Soon+c.Today}</div></div><div class="card">Expired<div class="big">${c.Expired}</div></div></div><br><p><button class="btn" onclick="exportCSV()">⬇ Export report (CSV)</button></p><div class="grid g2"><div class="card"><h3>Category share</h3><canvas id="c1"></canvas></div><div class="card"><h3>Expiries by month</h3><canvas id="c2"></canvas></div><div class="card"><h3>Upcoming expiries (next 8 weeks)</h3><canvas id="c3"></canvas></div></div>`)},
insights:()=>{const c=stats(),cc=catCount(),top=CATS[cc.indexOf(Math.max(...cc))],wk=S.products.filter(p=>days(p)>=0&&days(p)<=7);return shell("insights",`<h2>AI Insights</h2><p class="mu"><span class="tag">Sample dataset</span> Built from your current inventory (starts with sample products). Summaries are rule-based; <code>generateSummary()</code> is the hook to connect a real AI API later.</p><div class="grid g2"><div class="card"><h3>Inventory summary</h3><p>${generateSummary(c,top,wk)}</p></div><div class="card"><h3>Expiring this week</h3>${wk.length?wk.map(p=>`<div>${th(p)} ${esc(p.name)} — ${left(p)}</div>`).join("<br>"):empty("Nothing this week.")}</div><div class="card"><h3>Inventory distribution</h3><canvas id="c1"></canvas></div><div class="card"><h3>Monthly expiry trend</h3><canvas id="c2"></canvas></div></div><br><div class="card"><h3>Waste reduction tips</h3><ul><li>Move items expiring within 3 days to the front of the fridge.</li><li>Plan meals around expiring products.</li><li>Buy smaller quantities of fast-expiring items.</li></ul></div>`)},
assistant:()=>shell("assistant",`<h2>AI Assistant</h2><div class="card"><h3>Botpress webchat</h3><p class="mu">No chatbot is connected yet, and none is simulated. To embed yours: create a bot at botpress.com, publish it, copy the webchat <b>Inject script URL</b> and paste it into <code>BOTPRESS_INJECT_URL</code> in the code. Add your domain to the bot’s allowed origins. Never put secret keys in this file.</p><p><span class="tag">${BOTPRESS_INJECT_URL?"Embed URL set":"Not connected"}</span></p></div><br><div class="card"><h3>Quick guide (static help, not AI)</h3>${[["How do statuses work?","Safe: more than 7 days left. Expiring Soon: 1–7 days. Expires Today: 0 days. Expired: past the date."],["How do I add a product?","Open Add Product, enter name, category, quantity and expiry date, then save."],["How can I reduce waste?","Use items nearest to expiry first, plan meals around them and keep storage organised."],["What do the reminders do?","They appear in the Notifications page based on your Settings. External alerts are not connected."]].map(q=>`<details><summary>${q[0]}</summary><p class="mu">${q[1]}</p></details>`).join("")}</div>`),
settings:()=>{const P=S.prefs,u=S.user||{};return shell("settings",`<h2>Settings</h2><div class="grid g2"><div class="card"><h3>Profile</h3><label>Name</label><input id="sn" value="${esc(u.name||"")}"><label>Email</label><input id="se" value="${esc(u.email||"")}"><br><br><button class="btn" onclick="saveProf()">Save profile</button></div><div class="card"><h3>Notification preferences</h3>${[["d7","7 days before"],["d3","3 days before"],["d1","1 day before"],["d0","On expiry day"]].map(x=>`<label><input type="checkbox" style="width:auto" ${P[x[0]]?"checked":""} onchange="S.prefs.${x[0]}=this.checked;save()"> ${x[1]}</label>`).join("")}<p class="mu"><small>Shown in the in-app Notifications page.</small></p><button class="btn d" onclick="resetAll()">Reset all data</button></div></div>`)}
};
const BOTPRESS_INJECT_URL="";
function generateSummary(c,top,wk){return `You are tracking ${S.products.length} products: ${c.Safe} safe, ${c.Soon+c.Today} expiring soon and ${c.Expired} expired. Your most common category is ${top}. ${wk.length?wk.length+" item(s) expire within a week — use them first.":"Nothing expires within a week."}`}
const empty=t=>`<div class="mu" style="text-align:center;padding:20px">📭<br>${t}</div>`;
function route(){return(location.hash||"#home").slice(1)}
function go(keep){charts.forEach(c=>c.destroy());charts=[];const r=route(),v=V[r]||V.home,a=keep?document.activeElement&&document.activeElement.id:null;
$("#nav").innerHTML=[["home","Home"],["features","Features"],["how","How It Works"],["dashboard","Dashboard"],["assistant","AI Assistant"],["contact","Contact"]].map(x=>`<a href="#${x[0]}" class="${x[0]==r?"on":""}">${x[1]}</a>`).join("");
$("#who").innerHTML=S.user?`<button class="btn s sm" onclick="logout()">Logout</button>`:`<a class="btn sm" href="#login">Login</a>`;
$("#root").innerHTML=v();
if(a){const e=document.getElementById(a);if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(x){}}}
if(["features","how","contact"].includes(r))setTimeout(()=>{const e=document.getElementById(r);e&&e.scrollIntoView({behavior:"smooth"})},30);
if(r=="dashboard"||r=="insights")mk("c1",{type:"doughnut",data:{labels:CATS,datasets:[{data:catCount(),backgroundColor:COL}]}});
if(r=="reports")mk("c1",{type:"pie",data:{labels:CATS,datasets:[{data:catCount(),backgroundColor:COL}]}});
if(r=="reports"||r=="insights"){const[k,v2]=monthly();mk("c2",{type:"bar",data:{labels:k,datasets:[{label:"Products expiring",data:v2,backgroundColor:"#2f6fed"}]},options:{scales:{y:{beginAtZero:true,ticks:{precision:0}}}}})}
if(r=="reports"){const w=[...Array(8)].map((_,i)=>S.products.filter(p=>days(p)>=i*7&&days(p)<(i+1)*7).length);mk("c3",{type:"line",data:{labels:w.map((_,i)=>"Wk "+(i+1)),datasets:[{label:"Expiring",data:w,borderColor:"#34d399",tension:.3,fill:false}]},options:{scales:{y:{beginAtZero:true,ticks:{precision:0}}}}})}}
function log(t){S.log=(S.log||[]).concat(t).slice(-20)}
function saveP(){const n=$("#pn").value.trim(),x=$("#px").value,b=$("#pb").value,q=+$("#pq").value;let ok=true;$("#e1").textContent=$("#e2").textContent="";
if(n.length<2){$("#e1").textContent="Enter a product name (at least 2 characters).";ok=false}
if(!x){$("#e2").textContent="Expiry date is required.";ok=false}else if(b&&x<b){$("#e2").textContent="Expiry date cannot be before the purchase date.";ok=false}
if(!(q>=1)){$("#e2").textContent="Quantity must be at least 1.";ok=false}if(!ok)return;
const f=$("#pi").files[0],fin=img=>{const o={name:n,qty:q,cat:$("#pc").value,buy:b,exp:x,loc:$("#pl").value.trim(),rem:$("#pr").checked};
if(editId){const p=S.products.find(p=>p.id==editId);Object.assign(p,o);if(img)p.img=img;p.sample=false;log("Edited "+n)}else{S.products.push({...o,id:"p"+Date.now(),img:img||""});log("Added "+n)}
editId=null;save();location.hash="#products";go()};
if(f){if(f.size>400000){$("#e2").textContent="Image too large (max 400 KB).";return}const r=new FileReader();r.onload=()=>fin(r.result);r.readAsDataURL(f)}else fin("")}
function edit(id){editId=id;location.hash="#add";go()}
function del(id){const p=S.products.find(x=>x.id==id);if(!confirm("Delete "+p.name+"?"))return;S.products=S.products.filter(x=>x.id!=id);log("Deleted "+p.name);save();go()}
function view(id){const p=S.products.find(x=>x.id==id);$("#dlg").innerHTML=`<h3>${th(p)} ${esc(p.name)}</h3>${badge(p)}<p>Category: ${p.cat}<br>Quantity: ${p.qty}<br>Purchased: ${p.buy||"—"}<br>Expires: ${p.exp} (${left(p)})<br>Storage: ${esc(p.loc||"—")}<br>Reminder: ${p.rem?"on":"off"}</p><button class="btn" onclick="$('#dlg').close()">Close</button>`;$("#dlg").showModal()}
function exportCSV(){const rows=[["Name","Category","Quantity","Purchase","Expiry","Days left","Status","Location"]].concat(S.products.map(p=>[p.name,p.cat,p.qty,p.buy,p.exp,days(p),stat(p)[1],p.loc]));
const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="expiry-alert-report.csv";a.click()}
let reg=false;function tog(){reg=!reg;$("#nm").hidden=!reg;$("#lt").textContent=reg?"Create account":"Login";$("#tl").textContent=reg?"Have an account? Login":"New here? Create an account"}
function auth(){const e=$("#le").value.trim(),p=$("#lp").value,n=$("#ln").value.trim();let m="";if(reg&&n.length<2)m="Enter your name.";else if(!/^\S+@\S+\.\S+$/.test(e))m="Enter a valid email.";else if(p.length<6)m="Password must be at least 6 characters.";$("#lerr").textContent=m;if(m)return;S.user={name:n||e.split("@")[0],email:e};save();location.hash="#dashboard"}
function demo(){S.user={name:"Demo User",email:"demo@expiryalert.app"};save();location.hash="#dashboard"}
function logout(){S.user=null;save();location.hash="#home";go()}
function saveProf(){S.user={name:$("#sn").value.trim()||"User",email:$("#se").value.trim()};save();alert("Profile saved (in this browser only).")}
function resetAll(){if(confirm("Reset to sample data?")){localStorage.removeItem(KEY);S=load();go()}}
function contact(){const ok=$("#cn").value.trim()&&/^\S+@\S+\.\S+$/.test($("#ce").value)&&$("#cm").value.trim();$("#cerr").textContent=ok?"Demo form: nothing was sent.":"Please fill in all fields with a valid email.";if(ok)["#cn","#ce","#cm"].forEach(s=>$(s).value="")}
$("#th").onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue("--bg").trim()=="#0b1424";S.theme=dark?"light":"dark";d.dataset.theme=S.theme;save();go()};
if(BOTPRESS_INJECT_URL){const s=document.createElement("script");s.src=BOTPRESS_INJECT_URL;document.body.appendChild(s)}
addEventListener("hashchange",()=>{editId=route()=="add"?editId:null;go()});go();
</script></body></html>
